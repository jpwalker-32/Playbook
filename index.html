<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8F%80%3C/text%3E%3C/svg%3E"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Bixby White - 1st Grade playbook</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bungee&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" rel="stylesheet"><style id="app-css">
:root{--bg:#F2F4F8;--surface:#FFFFFF;--ink:#13203B;--muted:#56617A;--line:#D8DEE9;--team:#1F3A93;--on-team:#FFFFFF;--on-team-soft:#C9D4F5;--chip:#E6EBF5;--warn:#9A4A06;--focus:#F08A24;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1322;--surface:#161F35;--ink:#E7ECF6;--muted:#A2ADC6;--line:#2A3553;--team:#3F61D6;--on-team:#FFFFFF;--on-team-soft:#D6DEFA;--chip:#22304F;--warn:#F2B66B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D1322;--surface:#161F35;--ink:#E7ECF6;--muted:#A2ADC6;--line:#2A3553;--team:#3F61D6;--on-team:#FFFFFF;--on-team-soft:#D6DEFA;--chip:#22304F;--warn:#F2B66B;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;margin:0;line-height:1.15;font-weight:800}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
.top{background:var(--team-header,var(--team));color:var(--on-header,var(--on-team));padding:30px 0 70px}
.top h1{font-size:clamp(2.1rem,6vw,3.4rem);letter-spacing:-.02em}
.top p{margin:.3rem 0 0;color:var(--on-header-soft,var(--on-team-soft));font-size:1.05rem}
main.grid{display:grid;gap:20px;margin-top:-46px;padding-bottom:40px;grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){main.grid{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);align-items:start}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.side,.main-col{display:grid;gap:20px;align-content:start}
.versions{display:flex;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:5px;overflow-x:auto;margin:14px 0 4px}
.gh{font-size:.95rem;color:var(--muted);margin:0 0 8px}
.group+.group{margin-top:14px}
.picker .chips{margin-bottom:0}
#playName{font-size:1.8rem;letter-spacing:-.01em}
.desc{margin:.15rem 0 0;color:var(--muted)}
.step-head{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.versions button{flex:1 0 auto;border:0;background:transparent;color:var(--muted);border-radius:999px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer;white-space:nowrap}
.versions button[aria-selected="true"],.versions button[aria-pressed="true"]{background:var(--team);color:var(--on-team)}
.toggle-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.toggle-row .versions{margin:0}
.toggle-row .gh{margin:0}
.step-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
#stepNum{font-size:.85rem;color:var(--muted)}
#stepTitle{font-size:1.3rem}
.cap{margin:.35rem 0 12px;color:var(--muted);min-height:3.2em}
#court{width:100%;height:auto;display:block;border-radius:10px;font-family:"Atkinson Hyperlegible",system-ui,sans-serif}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;align-items:center}
.btn.big{font-size:1.15rem;padding:13px 22px;border-radius:16px;min-height:54px}
.btn.big.primary{box-shadow:0 4px 0 rgba(0,0,0,.2)}
.btn.big:active{transform:translateY(2px)}
.cap-row{display:flex;gap:12px;align-items:flex-start}
.cap-row .cap{flex:1}
.speak{flex:none}
.speak[aria-pressed="true"]{background:var(--team);border-color:var(--team);color:var(--on-team)}
.btn{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer}
.btn.primary{background:var(--team);border-color:var(--team);color:var(--on-team)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn:focus-visible,.versions button:focus-visible,input:focus-visible,select:focus-visible,.chip:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:14px;font-size:.85rem;color:var(--muted)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:5px}
.rules ol{margin:.25rem 0 0;padding-left:1.3rem}
.rules li{margin:.35rem 0}
.rules li b{font-family:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif}
.card h3{font-size:1.2rem;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{font:inherit;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:6px 12px;font-weight:700;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--team);border-color:var(--team);color:var(--on-team)}
.slot{display:grid;grid-template-columns:auto 70px minmax(0,1fr);gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.slot .role{font-size:.9rem;color:var(--muted)}
.slot .who{font-weight:700}
select,input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;min-width:0}
label.field{display:block;font-size:.9rem;color:var(--muted);margin-bottom:12px}
label.field input{margin-top:4px}
.prow{display:grid;grid-template-columns:58px minmax(0,1fr) auto auto;gap:8px;margin-bottom:8px;align-items:center}
.row-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.warn{color:var(--warn);font-size:.9rem;margin:8px 0 0}
.hint{color:var(--muted);font-size:.85rem;margin:10px 0 0}
.savebar{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
#saveStatus{color:var(--muted);font-size:.9rem}
.brand{display:flex;align-items:center;gap:18px}
#teamLogo{width:clamp(56px,12vw,88px);height:clamp(56px,12vw,88px);object-fit:contain;flex:none;border-radius:18px;overflow:hidden}
.look-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.look-row .lbl{flex:1;min-width:120px}
.look-row .lbl small{display:block;color:var(--muted);font-size:.85rem}
.thumb{width:48px;height:48px;border-radius:8px;border:1px dashed var(--line);object-fit:contain;background:var(--bg);flex:none;display:block}
input[type=color]{width:52px;height:40px;padding:3px;cursor:pointer;flex:none}
input[type=range]{padding:0;border:0;background:transparent;margin-top:6px}
.swatches{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 8px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.check{display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--muted);margin:8px 0 10px}
.check input{width:auto;margin:0}
.pchip{display:inline-flex;align-items:center;gap:6px;font:inherit;font-weight:700;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px 5px 5px;min-height:40px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.pchip .num{display:inline-grid;place-items:center;min-width:28px;height:28px;border-radius:50%;background:var(--chip);font-size:.8rem}
.pchip:not(:has(.num)){padding-left:12px}
.pchip[aria-pressed="true"]{border-color:var(--team);background:var(--chip)}
.pchip:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.slot.drop{border-radius:10px;padding:8px 6px;min-height:56px}
.bench{display:flex;flex-wrap:wrap;gap:8px;min-height:60px;padding:10px;border:2px dashed var(--line);border-radius:14px;align-items:center}
.drop.over{background:var(--chip);outline:2px dashed var(--team);outline-offset:-2px}
.empty{color:var(--muted);font-style:italic}
.drag-ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-50%) rotate(-4deg);box-shadow:0 10px 24px rgba(0,0,0,.28);margin:0}
.pickme{display:flex;flex-wrap:wrap;gap:10px}
.pickbtn{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:1.15rem;font-weight:800;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 18px 8px 8px;min-height:54px;cursor:pointer}
.pickbtn .num{display:inline-grid;place-items:center;min-width:36px;height:36px;border-radius:50%;background:var(--team);color:var(--on-team);font-size:.95rem}
.pickbtn:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.qstarrow{font-size:1.1rem;letter-spacing:2px}
.qprompt{font-family:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;font-size:clamp(1.4rem,4.5vw,1.9rem);font-weight:700;line-height:1.2;margin:.5rem 0 10px}
.qprompt b{color:var(--team)}
.qtools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
#qsound[aria-pressed="false"]{color:var(--muted)}
#qcourt{width:100%;height:auto;display:block;border-radius:10px;touch-action:none;cursor:pointer;font-family:"Atkinson Hyperlegible",system-ui,sans-serif}
.qfb{min-height:1.6em;margin:6px 0 0;font-size:1.1rem}
.qfb.good{color:#15803D}
.qdone{text-align:center;padding:20px 0 6px}
.qbig{font-family:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;font-size:clamp(1.5rem,5vw,2.1rem);font-weight:800;margin:0}
.qstars{font-size:1.8rem;letter-spacing:3px;margin:10px 0 16px}
.pulse{animation:qpulse .8s ease-in-out infinite alternate}
@keyframes qpulse{from{opacity:.2}to{opacity:.65}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .qfb.good{color:#4ADE80}}
:root[data-theme="dark"] .qfb.good{color:#4ADE80}
.lookpanel{display:flex;gap:14px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:-2px 0 12px}
.minifig{width:72px;height:auto;flex:none;background:#E7B985;border-radius:10px}
.lookopts{display:grid;gap:8px;min-width:0}
.lkrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.lklbl{font-size:.85rem;color:var(--muted);width:100%}
.lksw{width:30px;height:30px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.lksw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--team)}
.lkstyle{font:inherit;font-size:.9rem;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.lkstyle[aria-pressed="true"]{background:var(--team);border-color:var(--team);color:var(--on-team)}
.lksw:focus-visible,.lkstyle:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.top h1,#playName{font-family:Bungee,"Bricolage Grotesque",Impact,system-ui,sans-serif;font-weight:400;letter-spacing:.01em;text-shadow:0 3px 0 rgba(0,0,0,.25)}
#playName{font-size:1.9rem;color:var(--team)}
#court{background:#0B1023;box-shadow:0 10px 30px rgba(11,16,35,.35)}
.main-col,.side,.card{min-width:0}
.picker{padding:6px 14px 14px}
.cattabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:0 -14px;padding:0 10px;scrollbar-width:none}
.cattabs::-webkit-scrollbar{display:none}
.cattabs button{flex:none;font:inherit;font-weight:700;color:var(--muted);background:transparent;border:0;border-bottom:3px solid transparent;padding:12px 10px 10px;cursor:pointer;white-space:nowrap}
.cattabs button[aria-selected="true"]{color:var(--team);border-bottom-color:var(--team)}
.cattabs button:focus-visible{outline:3px solid var(--focus);outline-offset:-3px;border-radius:6px}
.subchips{margin:12px 0 0}
.brand-text{flex:1;min-width:0}
.gear{flex:none;align-self:flex-start;font:inherit;font-weight:700;color:var(--on-header,var(--on-team));background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.gear:hover{background:rgba(255,255,255,.24)}
.gear:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.settings{width:min(560px,94vw);max-height:88vh;padding:0;border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
.settings[open]{display:flex;flex-direction:column}
.settings::backdrop{background:rgba(8,12,28,.55)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.sheet-head h2{font-size:1.35rem}
.sheet-body{padding:6px 18px 12px;overflow:auto;flex:1}
.sheet-body #lookCard h3:first-child{display:none}
.sheet-foot{display:flex;align-items:center;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.sheet-foot span{flex:1;color:var(--muted);font-size:.9rem}
#court.iz [data-opp]{cursor:pointer}
#izDrive[aria-pressed="true"]{background:#F5C518;border-color:#F5C518;color:#13203B}
.rules-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.rules-head h3{margin:0}
.rules ol.rulelist{list-style:none;padding:0;margin:0;display:grid;gap:14px}
.rules .rulelist li{display:flex;gap:12px;align-items:flex-start;margin:0}
.ricon{flex:none;width:46px;height:46px;border-radius:12px;background:var(--chip);display:grid;place-items:center;font-size:1.45rem}
.rulelist b{font-size:1.1rem}
.chant{color:var(--team);font-weight:700;white-space:nowrap}
.rulelist p{margin:.2rem 0 0;color:var(--muted)}

let nzBuf=null;function noiseBuf(c){if(!nzBuf||nzBuf.sampleRate!==c.sampleRate){nzBuf=c.createBuffer(1,c.sampleRate,c.sampleRate);const d=nzBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}return nzBuf;}
function nz(c,at,len,type,freq,q,vol,freqEnd){const s=c.createBufferSource();s.buffer=noiseBuf(c);const f=c.createBiquadFilter();f.type=type;f.Q.value=q;f.frequency.setValueAtTime(freq,at);if(freqEnd)f.frequency.exponentialRampToValueAtTime(freqEnd,at+len);const g=c.createGain();g.gain.setValueAtTime(.0001,at);g.gain.linearRampToValueAtTime(vol,at+Math.min(.01,len/4));g.gain.exponentialRampToValueAtTime(.0001,at+len);s.connect(f);f.connect(g);g.connect(c.destination);s.start(at,Math.random()*.5,len+.05);}
function tone(c,at,len,type,f0,f1,vol){const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f0,at);o.frequency.exponentialRampToValueAtTime(f1,at+len);g.gain.setValueAtTime(.0001,at);g.gain.linearRampToValueAtTime(vol,at+.008);g.gain.exponentialRampToValueAtTime(.0001,at+len);o.connect(g);g.connect(c.destination);o.start(at);o.stop(at+len+.02);}
function squeak(c,at){[[0,2300,3300],[.09,2700,2100]].forEach(([d,a,b])=>{const o=c.createOscillator(),g=c.createGain(),v=c.createOscillator(),vg=c.createGain();o.type='sine';o.frequency.setValueAtTime(a,at+d);o.frequency.linearRampToValueAtTime(b,at+d+.07);v.frequency.value=38;vg.gain.value=90;v.connect(vg);vg.connect(o.frequency);g.gain.setValueAtTime(.0001,at+d);g.gain.linearRampToValueAtTime(.05,at+d+.015);g.gain.exponentialRampToValueAtTime(.0001,at+d+.08);o.connect(g);g.connect(c.destination);o.start(at+d);v.start(at+d);o.stop(at+d+.1);v.stop(at+d+.1);});}
function footsteps(c,at,len){for(let x=at;x<at+len;x+=.12+Math.random()*.03)nz(c,x,.035,'bandpass',450+Math.random()*350,1.4,.08);}
function bounce(c,at){tone(c,at,.14,'sine',140,55,.45);nz(c,at,.05,'lowpass',500,.7,.12);}
function whoosh(c,at,len){nz(c,at,len,'bandpass',350,1.2,.16,2600);}
function catchPop(c,at){nz(c,at,.06,'bandpass',1100,2,.28);tone(c,at,.07,'sine',190,120,.22);}
function swishSnd(c,at){nz(c,at,.4,'highpass',2600,.7,.16,5200);nz(c,at+.05,.3,'bandpass',1800,3,.08,900);}
function thud(c,at){tone(c,at,.12,'sine',95,60,.3);nz(c,at,.05,'lowpass',300,.7,.15);}
function playSfx(s,D){if(!sfxOn)return;const c=ac();if(!c)return;const t=c.currentTime+.03;try{
const runners=Object.keys(s.m).filter(k=>k!==s.drib);if(runners.length||s.drib){squeak(c,t);}if(runners.length)footsteps(c,t+.06,D-.12);
if(s.drib){for(let i=0;i<6;i++)bounce(c,t+.05+i*(D-.1)/6);}
if(s.pass){whoosh(c,t,D*.8);catchPop(c,t+D*.88);}
if(s.shot){whoosh(c,t,D*.85);swishSnd(c,t+D*.92);setTimeout(()=>{if(sfxOn)cheer(true);},D*950);}
if(s.ring&&s.m.b)thud(c,t+D*.95);}catch(e){}}

const ZA=[[[340,92],{g1:[340,150],g2:[235,225],w1:[445,225],w2:[270,368],b:[410,368]}],
[[120,222],{g2:[168,250],g1:[292,215],w1:[385,262],w2:[235,345],b:[335,370]}],
[[100,398],{w2:[150,388],g2:[190,300],b:[282,372],w1:[375,335],g1:[300,250]}],
[[560,222],{w1:[512,250],g1:[388,215],g2:[295,262],b:[445,345],w2:[345,370]}],

function computeZone(bp){let W=0;const out={};KEYS.forEach(k=>out[k]=[0,0]);ZA.forEach(([b,c])=>{const w=1/(Math.pow(d2(bp,b),2)+1);W+=w;KEYS.forEach(k=>{out[k][0]+=c[k][0]*w;out[k][1]+=c[k][1]*w;});});KEYS.forEach(k=>{out[k][0]/=W;out[k][1]/=W;});
let on=KEYS[0],best=1e9;KEYS.forEach(k=>{const d=d2(out[k],bp);if(d<best){best=d;on=k;}});
const dx=340-bp[0],dy=394-bp[1],L=Math.hypot(dx,dy)||1,gap=Math.min(50,L*.5);out[on]=[bp[0]+dx/L*gap,bp[1]+dy/L*gap];
for(let it=0;it<8;it++)for(let i=0;i<5;i++)for(let j=i+1;j<5;j++){const a=out[KEYS[i]],c=out[KEYS[j]],d=d2(a,c);if(d<48&&d>0){const p=(48-d)/(KEYS[i]===on||KEYS[j]===on?1:2),ux=(c[0]-a[0])/d,uy=(c[1]-a[1])/d;if(KEYS[i]!==on){a[0]-=ux*p;a[1]-=uy*p;}if(KEYS[j]!==on){c[0]+=ux*p;c[1]+=uy*p;}}}
